services:
  postgres:
    image: postgres:13
    container_name: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: dbname
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - 5433:5432
    networks:
      - hadoopcluster

  redis:
    image: redis:7.2-bookworm
    container_name: redis
    networks:
      - hadoopcluster

  # Serviço para inicializar o banco de dados (roda uma vez e para)
  airflow-init:
    build: .
    depends_on:
      - postgres
      - redis
    environment: &airflow_env
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://admin:admin@postgres:5432/dbname
      - AIRFLOW__CELERY__BROKER_URL=redis://redis:6379/0
      - AIRFLOW__CELERY__RESULT_BACKEND=db+postgresql://admin:admin@postgres:5432/dbname
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=True
    networks:
      - hadoopcluster
    entrypoint: /bin/bash
    command:
          - -c
          - |
            # 1. Garante que o schema do banco está atualizado
            airflow db migrate
            # 2. Cria as roles padrão (Admin, Public, etc) que estão faltando
            airflow sync-perm
            # 3. Agora sim, cria o usuário associando à role Admin que já existe
            airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com
    volumes:
      - ./dags:/usr/local/airflow/dags
      - dockervol:/dockervol

  airflow-webserver:
    build: .
    container_name: airflow_webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow_env
    volumes:
      - ./dags:/usr/local/airflow/dags
      - dockervol:/dockervol
    ports:
      - 8181:8080
    command: airflow webserver
    networks:
      - hadoopcluster
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    build: .
    container_name: airflow_scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow_env
    volumes:
      - ./dags:/usr/local/airflow/dags
      - dockervol:/dockervol
      - spark-logs:/opt/spark/spark-events
    command: airflow scheduler
    networks:
      - hadoopcluster

  airflow-worker:
    build: .
    container_name: airflow_worker
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow_env
    volumes:
      - ./dags:/usr/local/airflow/dags
      - dockervol:/dockervol
      - spark-logs:/opt/spark/spark-events
    command: airflow celery worker
    networks:
      - hadoopcluster

volumes:
  dockervol:
    external: true
  postgres_data:
  spark-logs:
    external: true

networks:
  hadoopcluster:
    external: true