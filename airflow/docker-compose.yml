services:
  postgres:
    image: postgres:13
    container_name: postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dbname
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hadoopcluster

  airflow:
    build: .
    container_name: airflow
    image: airflow:airflow
    environment:
      - HADOOP_CONF_DIR=/dockervol/hadoop/etc/hadoop/
      - HADOOP_HOME=/dockervol/hadoop/
      - SPARK_HOME=/dockervol/spark/
      - SPARK_CONF_DIR=/dockervol/spark/conf/
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=True
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://user:password@postgres/dbname
      - AIRFLOW__WEBSERVER__ENABLE_PROXY_FIX=True
      - AIRFLOW__WEBSERVER__WEB_SERVER_PORT=8181

    volumes:
      - ./dags:/opt/airflow/dags:rw
      - sparkapps:/opt/airflow/apps/shared:rwx
      - dockervol:/dockervol:rwx
      # - dockervol:/opt/hadoop:rw,subPath=hadoop
      # - dockervol:/opt/spark:rw,subPath=spark
      - spark-logs:/opt/spark/spark-events:rwx # Logs do Spark
    ports:
      - 8181:8181
    networks:
      - hadoopcluster

volumes:
  sparkapps:
    external: true

  dockervol:
    external: true

  postgres_data:

  spark-logs:
    external: true

networks:
  hadoopcluster:
    external: true
