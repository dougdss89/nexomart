name: CD Pipeline

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'

  workflow_dispatch:  # Permite trigger manual

jobs:
  build-and-push-docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    strategy:
      matrix:
        service: [dbapi, airflow]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub (opcional)
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
      if: github.event_name != 'pull_request'

    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          yourorg/data-plataform-${{ matrix.service }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-

    - name: Build and push DBAPI
      if: matrix.service == 'dbapi'
      uses: docker/build-push-action@v5
      with:
        context: ./data_plataform/dbapi
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push Airflow
      if: matrix.service == 'airflow'
      uses: docker/build-push-action@v5
      with:
        context: ./data_plataform/airflow
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-and-push-docker]
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging.yourapp.com

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to staging (placeholder)
      run: |
        echo "Deploy to staging environment"
        # Adicione aqui seus comandos de deploy
        # Exemplos:
        # - kubectl apply -f k8s/staging/
        # - aws ecs update-service ...
        # - docker-compose up -d

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-push-docker]
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://yourapp.com

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to production (placeholder)
      run: |
        echo "Deploy to production environment"
        # Adicione aqui seus comandos de deploy
        # Exemplos:
        # - kubectl apply -f k8s/production/
        # - aws ecs update-service ...
        # - terraform apply

  dbt-deploy:
    name: Deploy DBT Models
    runs-on: ubuntu-latest
    needs: [build-and-push-docker]
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dbt
      run: |
        pip install -r dbt/requirements.txt

    - name: Run dbt (placeholder)
      run: |
        cd dbt
        echo "Running dbt commands"
        # dbt deps
        # dbt run --target production
        # dbt test --target production

  notification:
    name: Send Deployment Notification
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()

    steps:
    - name: Send Slack notification (opcional)
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: 'Deployment finished'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
      if: always()
