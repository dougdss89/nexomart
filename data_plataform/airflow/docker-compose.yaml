services:
  redis:
    image: redis:7.2-bookworm
    container_name: redis
    networks:
      - hadoopcluster

    cpus: "0.5"
    mem_limit: 512m

  # Inicializa o banco de dados do Airflow (roda uma vez e para)
  airflow-init:
    build: .
    depends_on:
      - redis
    environment: &airflow_env
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://admin:admin@pgprojeto:5432/airflowdb
      - AIRFLOW__CELERY__BROKER_URL=redis://redis:6379/0
      - AIRFLOW__CELERY__RESULT_BACKEND=db+postgresql://admin:admin@pgprojeto:5432/airflowdb
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=True
      - PYTHONPATH=/usr/local/airflow/dags:/dockervol/configurations
    networks:
      - hadoopcluster
    entrypoint: /bin/bash
    command:
      - -c
      - |
        # Aguarda o pgprojeto estar pronto antes de migrar
        until airflow db migrate; do
          echo "Aguardando pgprojeto... tentando novamente em 5s"
          sleep 5
        done
        airflow sync-perm
        airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com
    volumes:
      - ./dags:/usr/local/airflow/dags
      - ../configurations:/dockervol/configurations
      - dockervol:/dockervol
      - spark-logs:/opt/spark/spark-events
      - spark-ivy-cache:/home/spark/.ivy2
      - spark-jobs:/usr/local/airflow/spark_jobs
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf

  airflow-webserver:
    build: .
    container_name: airflow_webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow_env
    volumes:
      - ./dags:/usr/local/airflow/dags
      - ../configurations:/dockervol/configurations
      - dockervol:/dockervol
      - spark-logs:/opt/spark/spark-events
      - spark-ivy-cache:/home/spark/.ivy2
      - spark-jobs:/usr/local/airflow/spark_jobs
    ports:
      - 8181:8080
    command: airflow webserver
    networks:
      - hadoopcluster
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

    cpus: "1.0"
    mem_limit: 1500m

  airflow-scheduler:
    build: .
    container_name: airflow_scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow_env
    volumes:
      - ./dags:/usr/local/airflow/dags
      - ../configurations:/dockervol/configurations
      - dockervol:/dockervol
      - spark-logs:/opt/spark/spark-events
      - spark-ivy-cache:/home/spark/.ivy2
      - spark-jobs:/usr/local/airflow/spark_jobs
    command: airflow scheduler
    networks:
      - hadoopcluster

    cpus: "1.5"
    mem_limit: 2g

  airflow-worker:
    build: .
    container_name: airflow_worker
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow_env
    volumes:
      - ./dags:/usr/local/airflow/dags
      - ../configurations:/dockervol/configurations
      - dockervol:/dockervol
      - spark-logs:/opt/spark/spark-events
      - spark-ivy-cache:/home/spark/.ivy2
      - spark-jobs:/usr/local/airflow/spark_jobs
      - /home/doug/project/data_plataform/spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
    command: airflow celery worker
    networks:
      - hadoopcluster
    extra_hosts:
      - "host.docker.internal:host-gateway"

    cpus: "2.0"
    mem_limit: 6g

volumes:
  dockervol:
    external: true
  spark-logs:
    external: true
  spark-ivy-cache:
    external: true
  spark-jobs:
    external: true

networks:
  hadoopcluster:
    external: true
