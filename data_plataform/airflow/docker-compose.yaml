services:
  redis:
    image: redis:7.2-bookworm
    container_name: redis
    env_file:
      - ../configs/secrets.env
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - hadoopcluster

    cpus: "0.5"
    mem_limit: 512m

  # Initializes the Airflow database (runs once and stops)
  airflow-init:
    build: .
    depends_on:
      - redis
    env_file:
      - ../configs/secrets.env
    environment: &airflow_env
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_AIRFLOW_DB}
      - AIRFLOW__CELERY__BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - AIRFLOW__CELERY__RESULT_BACKEND=db+postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_AIRFLOW_DB}
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=True
      - PYTHONPATH=/usr/local/airflow/dags:/dockervol/configs
      - AIRFLOW__LOGGING__BASE_LOG_FOLDER=/dockervol/airflow-logs
      - AIRFLOW__LOGGING__REMOTE_LOGGING=False
      - AIRFLOW__WEBSERVER__BASE_URL=http://localhost:8181
      - AIRFLOW__CELERY__WORKER_HOSTNAME=airflow-worker@airflow-worker
    networks:
      - hadoopcluster
    entrypoint: /bin/bash
    command:
      - -c
      - |
        # Waits for pgprojeto to be ready before migrating
        until airflow db migrate; do
          echo "Waiting for pgprojeto... retrying in 5s"
          sleep 5
        done
        airflow sync-perm
        airflow users create --username admin --password "${AIRFLOW_ADMIN_PASSWORD}" --firstname Admin --lastname User --role Admin --email admin@example.com
    volumes:
      - ./dags:/usr/local/airflow/dags
      - ../configs:/dockervol/configs
      - ../dbt:/dockervol/dbt
      - dockervol:/dockervol
      - spark-logs:/opt/spark/spark-events
      - spark-ivy-cache:/home/spark/.ivy2
      - ../spark/jobs:/usr/local/airflow/spark_jobs
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf

  airflow-webserver:
    build: .
    container_name: airflow_webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow_env
    volumes:
      - ./dags:/usr/local/airflow/dags
      - ../configs:/dockervol/configs
      - ../dbt:/dockervol/dbt
      - dockervol:/dockervol
      - spark-logs:/opt/spark/spark-events
      - spark-ivy-cache:/home/spark/.ivy2
      - ../spark/jobs:/usr/local/airflow/spark_jobs
    ports:
      - 8181:8080
    command: airflow webserver
    networks:
      - hadoopcluster
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

    cpus: "1.0"
    mem_limit: 1500m

  airflow-scheduler:
    build: .
    container_name: airflow_scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow_env
    volumes:
      - ./dags:/usr/local/airflow/dags
      - ../configs:/dockervol/configs
      - ../dbt:/dockervol/dbt
      - dockervol:/dockervol
      - spark-logs:/opt/spark/spark-events
      - spark-ivy-cache:/home/spark/.ivy2
      - ../spark/jobs:/usr/local/airflow/spark_jobs
    command: airflow scheduler
    networks:
      - hadoopcluster

    cpus: "1.5"
    mem_limit: 2g

  airflow-worker:
    build: .
    container_name: airflow_worker
    hostname: airflow-worker
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow_env
    volumes:
      - ./dags:/usr/local/airflow/dags
      - ../configs:/dockervol/configs
      - ../dbt:/dockervol/dbt
      - dockervol:/dockervol
      - spark-logs:/opt/spark/spark-events
      - spark-ivy-cache:/home/spark/.ivy2
      - ../spark/jobs:/usr/local/airflow/spark_jobs
      - /home/doug/project/data_plataform/spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
      # dbapi seeders run here via `uv run --project /dockervol` in an isolated venv
      # (see airflow/dockerfile) — same lockfile already validated on the host, without
      # conflicting with Airflow's own deps.
      - ../pyproject.toml:/dockervol/pyproject.toml:ro
      - ../uv.lock:/dockervol/uv.lock:ro
      - ../dbapi:/dockervol/dbapi:ro
    command: airflow celery worker -H airflow-worker@airflow-worker
    ports:
      - "8793:8793"
      - "4040:4040"
    networks:
      - hadoopcluster
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # SYS_PTRACE: lets py-spy (or gdb) attach to a running seeder/ingestion subprocess for a
    # live stack trace — added 2026-09-04 debugging an ingest_sales hang that showed real,
    # continuous CPU usage with no output, which ruled out a network-level stall (already fixed
    # separately in configs/api/minio.py) but needed to see the actual Python frame to diagnose.
    cap_add:
      - SYS_PTRACE

    cpus: "2.0"
    mem_limit: 6g

volumes:
  dockervol:
    external: true
  spark-logs:
    external: true
  spark-ivy-cache:
    external: true

networks:
  hadoopcluster:
    external: true
