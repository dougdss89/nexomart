        description: "Buyer dimension — tabela futura, ainda não populada pelo pipeline"

  - name: bronze
    database: iceberglake
    schema: bronze
    description: "Bronze layer — Iceberg tables (futuros jobs)"

  - name: silver
    database: iceberglake
    schema: silver
    description: "Silver layer — Iceberg tables (futuros jobs)"
