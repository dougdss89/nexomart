# database/schema here are just the connection default (Iceberg/Gold). Models that
# need to serve Power BI via Postgres override `database: postgres` in the
# model's own config() — the same Trino connection sees both catalogs
# (see trino/catalog/postgres.properties).
#
# All values come from configurations/secrets.env (already loaded as env in the
# Airflow container via env_file) — nothing is hardcoded here. The env_var()
# defaults only exist so it doesn't break if the var isn't set.
data_platform:
  target: dev
  outputs:
    dev:
      type: trino
      method: none
      host: "{{ env_var('TRINO_HOST', 'trino-coordinator') }}"
      port: "{{ env_var('TRINO_PORT', '8080') | int }}"
      user: airflow
      database: "{{ env_var('TRINO_CATALOG', 'nexo') }}"
      schema: "{{ env_var('TRINO_SCHEMA', 'gold') }}"
      threads: 4
      prepared_statements_enabled: false
