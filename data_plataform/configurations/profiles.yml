# database/schema aqui são só o default da conexão (Iceberg/Gold). Modelos que
# precisam servir o Power BI via Postgres sobrescrevem `database: postgres` no
# próprio config() do model — mesma conexão Trino enxerga os dois catálogos
# (ver trino/catalog/postgres.properties).
#
# Todos os valores vêm de configurations/secrets.env (já carregado como env do
# container do Airflow via env_file) — nada fica hardcoded aqui. Os defaults do
# env_var() só existem pra não quebrar se a var não estiver setada.
data_platform:
  target: dev
  outputs:
    dev:
      type: trino
      method: none
      host: "{{ env_var('TRINO_HOST', 'trino-coordinator') }}"
      port: "{{ env_var('TRINO_PORT', '8080') | int }}"
      user: airflow
      database: "{{ env_var('TRINO_CATALOG', 'iceberglake') }}"
      schema: "{{ env_var('TRINO_SCHEMA', 'gold') }}"
      threads: 4
      prepared_statements_enabled: false
