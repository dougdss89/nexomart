services:
  dbapi:
    build: .
    container_name: dbapi
    ports:
      - "8001:8000"
    volumes:
      - .:/workspace
      - configurations:/workspace/configurations
    networks:
      - hadoopcluster

    cpus: "0.5"
    mem_limit: 512m

networks:
  hadoopcluster:
    external: true

volumes:
  configurations:
    external: true
