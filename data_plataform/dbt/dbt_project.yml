name: 'data_platform'
version: '1.0.0'
config-version: 2

# Must match the profile in configs/profiles.yml
profile: 'data_platform'

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Default materialization: Gold tables live in the Iceberg catalog (nexo.gold, via UC REST —
# Spark writes to iceberglake, Trino/dbt reads from nexo, which is the profile's default
# "database"/"schema". Models that need to serve Power BI via Postgres individually override
# `database: postgres` (+ schema) in their own config() — Trino sees both catalogs on the
# same connection, so the cross-catalog CTAS (Iceberg -> Postgres) works without an extra adapter.
models:
  data_platform:
    gold:
      +materialized: table
      +schema: gold
