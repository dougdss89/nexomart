services:
  hive-metastore:
    build:
      context: .
    image: hive-metastore:local
    container_name: hive-metastore
    hostname: hive-metastore
    env_file:
      - ../configurations/secrets.env
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      # IS_RESUME=false (default) faz o entrypoint rodar `schematool -initOrUpgradeSchema`
      # a cada boot — para Hive 4.x isso é idempotente (verifica a versão e só inicializa/
      # atualiza o que faltar), diferente de IS_RESUME=true, que pula o schematool por
      # completo e deixa o datanucleus.schema.autoCreateAll criar só as tabelas mapeadas
      # via ORM sob demanda, nunca as tabelas só-SQL (TXNS, HIVE_LOCKS, WM_*) que o
      # Iceberg precisa para commit locking.
      IS_RESUME: "false"
    volumes:
      - ./conf/hive-site.xml:/opt/hive/conf/hive-site.xml
    ports:
      - "9083:9083"
    networks:
      - hadoopcluster

    cpus: "1.0"
    mem_limit: 1g

    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9083' 2>/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  hadoopcluster:
    external: true
