services:
  hive-metastore:
    build:
      context: .
    image: hive-metastore:local
    container_name: hive-metastore
    hostname: hive-metastore
    env_file:
      - ../configs/secrets.env
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      # IS_RESUME=false (default) makes the entrypoint run `schematool -initOrUpgradeSchema`
      # on every boot — for Hive 4.x this is idempotent (it checks the version and only
      # initializes/updates what's missing), unlike IS_RESUME=true, which skips schematool
      # entirely and leaves datanucleus.schema.autoCreateAll to create only the tables
      # mapped via ORM on demand, never the SQL-only tables (TXNS, HIVE_LOCKS, WM_*) that
      # Iceberg needs for commit locking.
      IS_RESUME: "false"
    volumes:
      - ./conf/hive-site.xml:/opt/hive/conf/hive-site.xml
    ports:
      - "9083:9083"
    networks:
      - hadoopcluster

    cpus: "1.0"
    mem_limit: 1g

    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9083' 2>/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  hadoopcluster:
    external: true
