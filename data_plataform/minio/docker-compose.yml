version: '3'
services:
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"     # API
      - "9001:9001"     # Console
      
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin

    command: server --console-address ":9001" /data

    cpus: "2.0"
    mem_limit: 4g

    volumes:
      - minio_data:/data
      - dockervol:/dockervol

    networks:
      - hadoopcluster

    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

networks:
  hadoopcluster:
    external: true

volumes:
  minio_data:

  dockervol:
    external: True
