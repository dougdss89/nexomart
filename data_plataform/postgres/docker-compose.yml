services:
  pgprojeto:
    image: pgvector/pgvector:pg16
    container_name: pgprojeto
    env_file:
      - ../configurations/secrets.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgprojeto_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    networks:
      - hadoopcluster

    cpus: "4.0"
    mem_limit: 8g

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  hadoopcluster:
    external: true

volumes:
  pgprojeto_data:
