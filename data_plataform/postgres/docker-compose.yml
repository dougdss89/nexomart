services:
  pgprojeto:
    image: pgvector/pgvector:pg16
    container_name: pgprojeto
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: admin
    volumes:
      - pgprojeto_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - hadoopcluster

    cpus: "1.5"
    mem_limit: 3g

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  hadoopcluster:
    external: true

volumes:
  pgprojeto_data:
