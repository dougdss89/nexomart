services:
  pgprojeto:
    image: pgvector/pgvector:pg16
    container_name: pgprojeto
    env_file:
      - ../configs/secrets.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: >
      postgres
      -c shared_buffers=${PG_SHARED_BUFFERS}
      -c work_mem=${PG_WORK_MEM}
      -c maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM}
      -c effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE}
      -c max_wal_size=${PG_MAX_WAL_SIZE}
      -c checkpoint_completion_target=${PG_CHECKPOINT_COMPLETION_TARGET}
      -c wal_compression=${PG_WAL_COMPRESSION}
      -c synchronous_commit=${PG_SYNCHRONOUS_COMMIT}
      -c fsync=${PG_FSYNC}
      -c full_page_writes=${PG_FULL_PAGE_WRITES}
      -c effective_io_concurrency=${PG_EFFECTIVE_IO_CONCURRENCY}
      -c maintenance_io_concurrency=${PG_MAINTENANCE_IO_CONCURRENCY}
      -c random_page_cost=${PG_RANDOM_PAGE_COST}
    volumes:
      # pg-data is a named bind-volume (type=none,o=bind -> see bottom of file) so Docker REFUSES
      # to mount when the postgres-ssd disk is not mounted, instead of silently creating an empty
      # dir and letting Postgres initdb a fresh, empty cluster over it. See the 2026-10-04
      # silent-initdb incident: a start with the disk unmounted "lost" nexomart + Airflow history
      # (data was shadowed on the real disk). The make check-postgres-disk guard only covers make
      # targets; this covers ANY start (docker compose up, Docker Desktop, auto-start after reboot).
      - pg-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    networks:
      - hadoopcluster

    cpus: "2.0"
    mem_limit: 6g
    shm_size: 2gb

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  hadoopcluster:
    external: true

volumes:
  # Bind to the postgres-ssd disk. Fails loudly (mount error) if the disk is not mounted at
  # ${POSTGRES_DATA_DIR}, instead of Postgres initializing an empty cluster. See service note.
  pg-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${POSTGRES_DATA_DIR}
