[project]
name = "data-plataform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apache-airflow-providers-amazon>=9.21.0",
    "apache-airflow-providers-apache-iceberg>=1.4.1",
    "apache-airflow-providers-apache-kafka>=1.12.0",
    "apache-airflow-providers-apache-spark[cncf,common-compat]==4.9.0",
    "apache-airflow-providers-celery>=3.16.0",
    "apache-airflow-providers-common-sql>=1.32.0",
    "apache-airflow-providers-databricks>=7.10.0",
    "apache-airflow-providers-docker>=4.5.2",
    "apache-airflow-providers-jdbc>=5.4.0",
    "apache-airflow-providers-microsoft-mssql>=4.5.0",
    "apache-airflow-providers-openlineage==1.9",
    "apache-airflow-providers-pgvector>=1.7.0",
    "apache-airflow-providers-postgres>=6.6.0",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "connexion[swagger-ui]>=3.3.0",
    "diagrams>=0.25.1",
    "dotenv>=0.9.9",
    "faker>=40.11.0",
    "fastapi>=0.110.0",
    "flask-session==0.5.0",
    "ipython>=9.10.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyarrow>=14.0.0",
    "pygments>=2.19.2",
    "pyiceberg[pyarrow,s3fs]>=0.6.0",
    "pynessie>=0.67.0",
    "pyspark==3.5.8",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.22",
    "pytz>=2026.1.post1",
    "requests>=2.32.5",
    "six>=1.17.0",
    "stack-data>=0.6.3",
    "statsd>=4.0.1",
    "traitlets>=5.14.3",
    "uvicorn>=0.27.0",
]

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["*/migrations/*", "*/.venv/*", "*/venv/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    ".venv",
    "venv",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = [
    "tests",
    "dbapi/tests",
]
pythonpath = [
    ".",
    "dbapi",
]

[tool.coverage.run]
source = ["dbapi", "airflow"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/.venv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
