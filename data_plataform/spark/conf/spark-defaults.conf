# --- Configuração Básica ---
spark.master                     spark://spark-master:7077
spark.eventLog.enabled           true
spark.eventLog.dir               /opt/spark/spark-events
spark.history.ui.port            18080
spark.history.fs.logDirectory    file:/opt/spark/spark-events
spark.jars.ivy /home/spark/.ivy2

# --- SQL e Warehouse ---
# spark.sql.warehouse.dir          s3a://sparkdw/
spark.sql.parquet.compression.codec snappy
spark.sql.execution.arrow.pyspark.enabled true

# --- Recursos ---
# Worker: 8 cores / 18GB → 2 executors de 4 cores cada (4+4=8 cores, 8g+8g=16g + overhead)
# spark.cores.max deve ser igual ao total de cores disponíveis no(s) worker(s)
spark.sql.shuffle.partitions     32
spark.default.parallelism        32
spark.executor.memory            8g
spark.driver.memory              4g
spark.executor.cores             4
spark.driver.cores               2
spark.executor.memoryOverhead    2g
spark.cores.max                  8

# --- JVM Options ---
spark.executor.extraJavaOptions  -XX:+UseG1GC -XX:+UseStringDeduplication -XX:InitiatingHeapOccupancyPercent=35 -Dlog4j.configuration=file:/opt/spark/conf/log4j.properties -Daws.java.v1.disableDeprecationAnnouncement=true
spark.driver.extraJavaOptions    -XX:+UseG1GC -XX:+UseStringDeduplication -XX:InitiatingHeapOccupancyPercent=35 -Dlog4j.configuration=file:/opt/spark/conf/log4j.properties -Daws.java.v1.disableDeprecationAnnouncement=true

# --- MinIO (S3A) - Usado para ler a Landing Layer ---
spark.hadoop.fs.s3a.impl         org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.endpoint     http://minio:9000
spark.hadoop.fs.s3a.access.key   minioadmin
spark.hadoop.fs.s3a.secret.key   minioadmin
spark.hadoop.fs.s3a.path.style.access true
spark.hadoop.fs.s3a.connection.ssl.enabled false

# --- Catálogos e Extensões ---
spark.sql.extensions             org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions,io.delta.sql.DeltaSparkSessionExtension,org.projectnessie.spark.extensions.NessieSparkSessionExtensions

# --- ICEBERG + NESSIE ---
spark.sql.catalog.icebergdw         org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.icebergdw.catalog-impl org.apache.iceberg.nessie.NessieCatalog
spark.sql.catalog.icebergdw.uri     http://nessie:19120/api/v1
spark.sql.catalog.icebergdw.ref     dev
spark.sql.catalog.icebergdw.authentication.type NONE
spark.sql.catalog.icebergdw.warehouse s3a://sparkdw/
spark.sql.catalog.icebergdw.io-impl org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.icebergdw.cache-enabled false

#otimiza joins skew shuffle escrita Iceberg
spark.sql.adaptive.enabled true
spark.sql.adaptive.coalescePartitions.enabled true
spark.sql.adaptive.skewJoin.enabled true
spark.sql.adaptive.localShuffleReader.enabled true
spark.sql.catalog.icebergdw.write.target-file-size-bytes 536870912

# Configurações do S3FileIO específicas para achar o MinIO
# Aumenta o limite de conexões simultâneas para não criar gargalo na gravação de partições
# melhora a escrita no minio
spark.sql.catalog.icebergdw.s3.endpoint           http://minio:9000
spark.sql.catalog.icebergdw.s3.path-style-access  true
spark.sql.catalog.icebergdw.s3.access-key-id      minioadmin
spark.sql.catalog.icebergdw.s3.secret-access-key  minioadmin
spark.sql.catalog.icebergdw.client.region         us-east-1
spark.hadoop.fs.s3a.connection.timeout 120000
spark.hadoop.fs.s3a.connection.establish.timeout 60000
spark.hadoop.fs.s3a.threads.max 200
spark.hadoop.fs.s3a.connection.maximum 200
spark.hadoop.fs.s3a.fast.upload true
spark.hadoop.fs.s3a.multipart.size 134217728
spark.hadoop.fs.s3a.multipart.threshold 134217728

# Quantas vezes o Spark vai tentar reenviar o pacote caso dê IncompleteBody (Padrão é 1, vamos para 10)
spark.hadoop.fs.s3a.attempts.maximum              10

# Otimização de Comitter: Evita criar e renomear arquivos temporários desnecessários no S3
spark.sql.sources.commitProtocolClass org.apache.spark.internal.io.cloud.PathOutputCommitProtocol
spark.hadoop.mapreduce.fileoutputcommitter.algorithm.version 2
spark.hadoop.mapreduce.fileoutputcommitter.cleanup-failures.ignored true
spark.sql.catalog.icebergdw.write.distribution-mode hash #otimização específica para Iceberg em MinIO que melhora MUITO a escrita:


# --- DELTA ---
spark.sql.catalog.spark_catalog           org.apache.spark.sql.delta.catalog.DeltaCatalog
spark.sql.catalog.spark_catalog.warehouse s3a://deltadw/

# --- Packages (Versões Corrigidas e Estáveis para Spark 3.5 e Scala 2.13) ---
# 1. Delta foi para 3.2.1 (Estável)
# 2. Nessie com o group ID oficial "nessie-integrations"
# 3. Adicionado o iceberg-aws-bundle para o S3FileIO não quebrar
spark.jars.packages  io.delta:delta-spark_2.13:3.2.1,org.apache.hadoop:hadoop-aws:3.3.4,org.apache.iceberg:iceberg-spark-runtime-3.5_2.13:1.10.1,org.apache.iceberg:iceberg-aws-bundle:1.10.1,org.projectnessie.nessie-integrations:nessie-spark-extensions-3.5_2.13:0.74.0,org.postgresql:postgresql:42.7.5,com.microsoft.sqlserver:mssql-jdbc:12.8.1.jre11