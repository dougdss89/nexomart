services:

  sparkmaster:
    container_name: spark-master
    build: .
    image: sparkairflow:spark
    entrypoint: ['/opt/spark/entrypoint.sh', 'master']

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

    volumes:
      - spark-jobs:/workspace/jobs
      - ./devapplication:/opt/spark/development
      - spark-logs:/opt/spark/spark-events
      - configs:/dockervol/configs
      - dockervol:/dockervol
      - spark-ivy-cache:/home/spark/.ivy2

    env_file:
      - .env.spark

    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - PYTHONPATH=/opt/spark/python:/opt/spark/python/lib/py4j-*.zip:/opt/spark/jobs:/dockervol/configs

    cpus: "1.0"
    mem_limit: 2g

    ports:
      - "9090:8080"
      - "7077:7077"

    networks:
      - hadoopcluster


  spark-history-server:
    container_name: sparkhistory
    image: sparkairflow:spark
    entrypoint: ['./entrypoint.sh', 'history']

    depends_on:
      sparkmaster:
        condition: service_healthy

    env_file:
      - .env.spark

    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - PYTHONPATH=/opt/spark/python:/opt/spark/python/lib/py4j-*.zip:/opt/spark/jobs:/dockervol/configs

    volumes:
      - spark-jobs:/opt/spark/jobs
      - ./devapplication:/opt/spark/development
      - spark-logs:/opt/spark/spark-events
      - configs:/dockervol/configs
      - dockervol:/dockervol
      - spark-ivy-cache:/home/spark/.ivy2

    cpus: "0.5"
    mem_limit: 512m

    ports:
      - "18080:18080"

    networks:
      - hadoopcluster


  # Dedicated host for Spark DRIVERS (client mode). Airflow no longer runs spark-submit itself:
  # SparkDriverSubmitOperator (airflow/dags/nexomart/common/spark_driver.py) does a `docker exec`
  # of spark-submit in this container, so the driver's memory/CPU is accounted here and not in
  # airflow_worker. Standalone clusters do not support --deploy-mode cluster for Python apps,
  # which is why this is an always-on edge container instead of a cluster-mode submit.
  spark-driver:
    container_name: spark-driver
    hostname: spark-driver
    image: sparkairflow:spark
    entrypoint: ['sleep', 'infinity']

    depends_on:
      sparkmaster:
        condition: service_healthy

    env_file:
      - .env.spark
      # PGUSER/PGPWD/... read by spark/src/common/manifest.py (landing_runs JDBC read)
      - ../dbapi/api/.env

    environment:
      # Executors connect back to the driver by this name (same Docker network).
      - SPARK_LOCAL_HOSTNAME=spark-driver
      # Generated spark-defaults.conf (make generate-confs) is read from the bind below, so the
      # driver always sees the current file instead of the copy baked into the image.
      - SPARK_CONF_DIR=/opt/spark/driver-conf

    volumes:
      - spark-ivy-cache:/home/spark/.ivy2
      - configs:/dockervol/configs
      - dockervol:/dockervol
      # App code, mounted from the repo so changes need no rebuild/sync.
      - ../spark/src:/dockervol/spark/src:ro
      - ./conf:/opt/spark/driver-conf:ro

    cpus: "2.0"
    mem_limit: 6g

    ports:
      # Live driver UI / DataFlint (was published by airflow_worker)
      - "4040:4040"

    networks:
      - hadoopcluster


  spark-worker:
    image: sparkairflow:spark
    entrypoint: ['./entrypoint.sh', 'worker']

    depends_on:
      sparkmaster:
        condition: service_healthy

    env_file:
      - .env.spark

    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=${SPARK_WORKER_CORES}
      - SPARK_WORKER_MEMORY=${SPARK_WORKER_MEMORY}
      - PYTHONPATH=/opt/spark/python:/opt/spark/python/lib/py4j-*.zip:/opt/spark/jobs:/dockervol/configs

    # Sized to fit 3 replicas (docker compose up -d --scale spark-worker=3) within a
    # 24-core / 54GB Docker budget, leaving room for the rest of the stack (Postgres,
    # MinIO, Hive Metastore, Trino, Airflow, dbapi). Smaller, more numerous workers are
    # also better for tuning exercises: they force real shuffle/spill instead of a
    # single giant worker solving everything in local memory.
    # Adjust SPARK_WORKER_CORES/MEMORY in configs/secrets.env, not here.
    cpus: "${SPARK_WORKER_CORES}"
    mem_limit: ${SPARK_WORKER_MEM_LIMIT}

    volumes:
      - spark-jobs:/opt/spark/jobs
      - ./devapplication:/opt/spark/development
      - spark-logs:/opt/spark/spark-events
      - dockervol:/dockervol
      - spark-ivy-cache:/home/spark/.ivy2

    networks:
      - hadoopcluster

    extra_hosts:
      - "host.docker.internal:host-gateway"


networks:
  hadoopcluster:
    external: true


volumes:
  dockervol:
    external: true
  spark-logs:
    external: true
  spark-ivy-cache:
    external: true
  spark-jobs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./jobs
  configs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../configs