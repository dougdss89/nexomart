services:

  sparkmaster:
    container_name: spark-master
    build: .
    image: sparkairflow:spark
    entrypoint: ['/opt/spark/entrypoint.sh', 'master']

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

    volumes:
      - spark-jobs:/workspace/jobs
      - ./devapplication:/opt/spark/development
      - spark-logs:/opt/spark/spark-events
      - configurations:/dockervol/configurations
      - dockervol:/dockervol
      - spark-ivy-cache:/home/spark/.ivy2

    env_file:
      - .env.spark

    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - PYTHONPATH=/opt/spark/python:/opt/spark/python/lib/py4j-*.zip:/opt/spark/jobs:/dockervol/configurations

    cpus: "1.0"
    mem_limit: 2g

    ports:
      - "9090:8080"
      - "7077:7077"

    networks:
      - hadoopcluster


  spark-history-server:
    container_name: sparkhistory
    image: sparkairflow:spark
    entrypoint: ['./entrypoint.sh', 'history']

    depends_on:
      sparkmaster:
        condition: service_healthy

    env_file:
      - .env.spark

    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - PYTHONPATH=/opt/spark/python:/opt/spark/python/lib/py4j-*.zip:/opt/spark/jobs:/dockervol/configurations

    volumes:
      - spark-jobs:/opt/spark/jobs
      - ./devapplication:/opt/spark/development
      - spark-logs:/opt/spark/spark-events
      - configurations:/dockervol/configurations
      - dockervol:/dockervol
      - spark-ivy-cache:/home/spark/.ivy2

    cpus: "0.5"
    mem_limit: 512m

    ports:
      - "18080:18080"

    networks:
      - hadoopcluster


  spark-worker:
    image: sparkairflow:spark
    entrypoint: ['./entrypoint.sh', 'worker']

    depends_on:
      sparkmaster:
        condition: service_healthy

    env_file:
      - .env.spark

    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=${SPARK_WORKER_CORES}
      - SPARK_WORKER_MEMORY=${SPARK_WORKER_MEMORY}
      - PYTHONPATH=/opt/spark/python:/opt/spark/python/lib/py4j-*.zip:/opt/spark/jobs:/dockervol/configurations

    # Dimensionado para caber 3 réplicas (docker compose up -d --scale spark-worker=3)
    # dentro de um budget de 24 cores / 54GB Docker, sobrando espaço para o resto da
    # stack (Postgres, MinIO, Hive Metastore, Trino, Airflow, dbapi). Workers menores
    # e em maior número também são melhores para exercícios de tuning: forçam shuffle/
    # spill real em vez de um único worker gigante resolvendo tudo em memória local.
    # Ajuste SPARK_WORKER_CORES/MEMORY em configurations/secrets.env, não aqui.
    cpus: "${SPARK_WORKER_CORES}"
    mem_limit: ${SPARK_WORKER_MEM_LIMIT}

    volumes:
      - spark-jobs:/opt/spark/jobs
      - ./devapplication:/opt/spark/development
      - spark-logs:/opt/spark/spark-events
      - dockervol:/dockervol
      - spark-ivy-cache:/home/spark/.ivy2

    networks:
      - hadoopcluster

    extra_hosts:
      - "host.docker.internal:host-gateway"


networks:
  hadoopcluster:
    external: true


volumes:
  dockervol:
    external: true
  spark-logs:
    external: true
  spark-ivy-cache:
    external: true
  spark-jobs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./jobs
  configurations:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../configurations