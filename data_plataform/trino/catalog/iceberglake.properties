connector.name=iceberg
iceberg.catalog.type=hive_metastore
hive.metastore.uri=${ENV:HIVE_METASTORE_URI}
iceberg.format-version=2

# MinIO (S3-compatible)
fs.native-s3.enabled=true
s3.endpoint=${ENV:MINIO_ENDPOINT}
s3.aws-access-key=${ENV:MINIO_ACCESS_KEY}
s3.aws-secret-key=${ENV:MINIO_SECRET_KEY}
s3.path-style-access=true
s3.region=us-east-1

# Catálogo Iceberg com backend Hive Metastore. Pipeline AdventureWorks (legado).
# Spark escreve via iceberglake (IcebergHiveCatalog), Trino lê aqui.
# Migração futura → nexo (UC REST catalog) quando UC OSS tiver write support.
