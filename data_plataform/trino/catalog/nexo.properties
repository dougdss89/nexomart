connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=${ENV:UNITYCATALOG_REST_URI}
iceberg.rest-catalog.warehouse=unity
iceberg.rest-catalog.security=NONE
iceberg.format-version=3

# MinIO (S3-compatible)
fs.native-s3.enabled=true
s3.endpoint=${ENV:MINIO_ENDPOINT}
s3.aws-access-key=${ENV:MINIO_ACCESS_KEY}
s3.aws-secret-key=${ENV:MINIO_SECRET_KEY}
s3.path-style-access=true
s3.region=us-east-1
