connector.name=delta_lake
hive.metastore.uri=${ENV:HIVE_METASTORE_URI}

# MinIO (S3-compatible)
fs.native-s3.enabled=true
s3.endpoint=${ENV:MINIO_ENDPOINT}
s3.aws-access-key=${ENV:MINIO_ACCESS_KEY}
s3.aws-secret-key=${ENV:MINIO_SECRET_KEY}
s3.path-style-access=true
s3.region=us-east-1

# Catálogo Delta Lake com backend Hive Metastore. Catálogo "oficial da plataforma" (nexo).
# Spark escreve via spark_catalog.nexo_<layer> (ver spark/conf/spark-defaults.conf.template),
# Trino lê aqui via connector delta_lake.
# HMS standalone não tem tabelas ACID — escritor único (Airflow sequencial), sem lock distribuído.
#
# Tentativa anterior: catálogo nativo Unity Catalog OSS (UCSingleCatalog) — abandonada porque a
# emissão de credenciais temporárias do UC OSS (confirmado na v0.6.0, a mais recente) só
# funciona contra S3 real, sem suporte a endpoint customizável (MinIO). Ver
# spark-defaults.conf.template para o histórico completo.
delta.enable-non-concurrent-writes=true
