connector.name=postgresql
connection-url=jdbc:postgresql://${ENV:POSTGRES_HOST}:${ENV:POSTGRES_PORT}/${ENV:POSTGRES_GOLD_DB}
connection-user=${ENV:POSTGRES_USER}
connection-password=${ENV:POSTGRES_PASSWORD}

# Camada de serving para BI (Power BI): dbt-trino materializa aqui os marts do Gold
# (Delta Lake, catálogo nexo — Hive Metastore, dbt default) via CTAS cross-catalog, ex:
#   CREATE TABLE postgres.public.dim_x AS SELECT * FROM nexo.gold.dim_x
# golddw é um banco dedicado à camada de serving, separado do OLTP (dougstore).
# Host/porta/nome do banco vêm de configurations/secrets.env (POSTGRES_HOST/PORT/GOLD_DB) —
# mudar lá é o suficiente, nada fica hardcoded aqui.
# Precisa existir no Postgres antes do primeiro uso: ver postgres/init/01-create-databases.sh
# (só roda no primeiro boot do volume — se o volume já existir, criar manualmente com
# `CREATE DATABASE golddw;`, ou o valor que POSTGRES_GOLD_DB tiver).
