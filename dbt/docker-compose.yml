services:
  dbt_server:
    build: .
    image: dbt:dbt
    container_name: dbt_server

    networks:
      - hadoopcluster

    volumes:
      # Mapeia sua pasta local para dentro do container
      - .:/usr/app/dbt
      - dockervol:/dockervol
    ports:
      - "2222:22" # Permite que você acesse via terminal: ssh dbt@localhost -p 2222

networks:
  hadoopcluster:
    external: true         # Usa uma rede existente
    name: hadoopcluster # Substitua pelo nome da sua rede existente

volumes:

  dockervol:
    external: true

  postgres_data:

  spark-logs:
    external: true