version: '3'
services:
  nodemaster:
    image: hadoopcluster:hadoop
    hostname: nodemaster.hdp.com
    container_name: nodemaster
    networks:
      - hadoopcluster
    ports:
      - "50070:50070"
      - "8000:8000"
      - "8020:8020"
      - "8088:8088"
      - "8485:8485"
    volumes:
      - dockervol:/volume_test
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW

  datanode1:
    image: hadoopcluster:hadoop
    hostname: datanode1.hdp.com
    container_name: datanode1
    networks:
      - hadoopcluster
    ports:
      - "50072:50070"
      - "8002:8000"
      - "8022:8020"
      - "8082:8088"
      - "8487:8485"
      - "9864:9864"
      - "8087:8088"
    volumes:
      - dockervol:/dockervol
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW

  secondnode:
    image: hadoopcluster:hadoop
    hostname: secondnode.hdp.com
    container_name: secondnode
    networks:
      - hadoopcluster
    ports:
      - "50071:50070"
      - "8001:8000"
      - "8021:8020"
      - "8081:8088"
      - "8486:8485"
    volumes:
      - dockervol:/dockervol
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW

networks:
  hadoopcluster:
    driver: bridge
    external: True

volumes:
  dockervol:
    external: True