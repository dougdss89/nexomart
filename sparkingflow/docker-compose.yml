x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: dockerfile
  env_file:
    - airflow.env
  volumes:
    - ./jobs:/opt/airflow/jobs
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
  depends_on:
    - postgres
  networks:
    - sparkairflow
  restart: always

services:
  spark-master:
    container_name: sparkingflow
    build:
      context: .
      dockerfile: sparkdockerfile
    image: sparkimage
    entrypoint: ['./entrypoint.sh', 'master']
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080" ]
      interval: 5s
      timeout: 3s
      retries: 3
    volumes:
      - ./jobs:/opt/spark/jobs
      - spark-logs:/opt/spark/spark-events
    env_file:
      - .env.spark
    ports:
      - '9090:8080'
      - '7077:7077'
    networks:
      - sparkairflow

  spark-worker:
    image: sparkimage
    entrypoint: ['./entrypoint.sh', 'worker']
    depends_on:
      - spark-master
    env_file:
      - .env.spark
    volumes:
      - ./jobs:/opt/spark/jobs
      - spark-logs:/opt/spark/spark-events
    networks:
      - sparkairflow

  spark-history-server:
    container_name: sparkexeclogs
    image: sparkimage
    entrypoint: ['./entrypoint.sh', 'history']
    depends_on:
      - spark-master
    env_file:
      - .env.spark
    volumes:
      - spark-logs:/opt/spark/spark-events
    ports:
      - '18080:18080'
    networks:
      - sparkairflow

  postgres:
    image: postgres:14.0
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    networks:
      - sparkairflow
    restart: always

  webserver:
    <<: *airflow-common
    command: bash -c "airflow db upgrade && airflow webserver"
    ports:
      - "8080:8080"
    depends_on:
      - scheduler

  scheduler:
    <<: *airflow-common
    command: bash -c "airflow db upgrade && airflow users create --username admin --firstname doug --lastname doug --email doug@gmail.com --role Admin --password admin && airflow scheduler"

networks:
  sparkairflow:

volumes:
  spark-logs:
