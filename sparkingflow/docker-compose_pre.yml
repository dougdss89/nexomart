version: '3.8'

# services:
#   spark-common: &spark-common
#     image: bitnami/spark:latest
#     volumes:
#       - ./jobs:/opt/bitnami/spark/jobs
#     networks:
#       - sparkairflow
#     restart: always

  airflow-common: &airflow-common
    build:
      context: .
      dockerfile: dockerfile
    env_file:
      - airflow.env
    volumes:
      - ./jobs:/opt/airflow/jobs
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
    depends_on:
      - postgres
    networks:
      - sparkairflow
    restart: always

  spark-master:
    <<: *spark-common
    command: bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "9090:8080"
      - "7077:7077"

  # spark-worker:
  #   <<: *spark-common
  #   command: bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
  #   environment:
  #     SPARK_MODE: worker
  #     SPARK_WORKER_CORES: 3
  #     SPARK_WORKER_MEMORY: 8g
  #     SPARK_MASTER_URL: spark://spark-master:7077
  #   depends_on:
  #     - spark-master

  sparkhistory:
    <<: *spark-common
    command: bin/spark-class org.apache.spark.deploy.history.HistoryServer
    ports:
      - "18080:18080"
    environment:
      SPARK_HISTORY_OPTS: -Dspark.history.fs.logDirectory=/tmp/spark-events
    volumes:
      - ./history:/tmp/spark-events
    depends_on:
      - spark-master

  postgres:
    image: postgres:14.0
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    networks:
      - sparkairflow
    restart: always

  webserver:
    <<: *airflow-common
    command: bash -c "airflow db upgrade && airflow webserver"
    ports:
      - "8080:8080"
    depends_on:
      - scheduler

  scheduler:
    <<: *airflow-common
    command: bash -c "airflow db upgrade && airflow users create --username admin --firstname doug --role Admin --password admin && airflow scheduler"

networks:
  sparkairflow:
